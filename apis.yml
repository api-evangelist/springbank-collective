description: 'Springbank Collective (Springbank) is an early-stage venture capital
  firm investing in mission-critical infrastructure technology across three core sectors
  — work, live, and care. The firm backs pre-seed through Series A companies building
  AI-driven productivity tools for frontline workers and small businesses, innovation
  responding to demographic change and the multi-trillion-dollar generational wealth
  transfer, and healthcare and caregiving delivery infrastructure. Springbank emphasizes
  backing world-class founding teams of all genders and backgrounds. It was surfaced
  as a portfolio-adjacent company of foundry-group and tracked within the API Evangelist
  network; the firm itself publishes no public API or developer surface.'
